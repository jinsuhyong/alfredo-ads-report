<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alfredo · Meta Ads Report</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --red:#c40f15; --gold:#ffc045; --ink:#2a211c; --muted:#7d6f64;
  --line:#eadfcc; --bg:#f8f3eb; --card:#fff; --soft:#faf5ec;
  --hf:'Cormorant Garamond',Georgia,serif;
  --bf:'DM Sans','Sarabun',system-ui,sans-serif;
}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--bf);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased}
:lang(th) body,html[lang=th] body{font-family:'Sarabun','DM Sans',system-ui,sans-serif}
.wrap{max-width:1400px;margin:0 auto;padding:0 32px}
@media(max-width:760px){.wrap{padding:0 18px}}

/* header */
.hdr{position:sticky;top:0;z-index:30;background:#fffdf9;border-bottom:1px solid var(--line);box-shadow:0 1px 0 rgba(42,33,28,.03)}
.hdr-in{display:flex;align-items:center;gap:24px;padding:18px 0}
.logo{width:44px;height:44px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--hf);font-size:24px;font-weight:600;flex:0 0 auto}
.brand{font-family:var(--hf);font-size:25px;line-height:1.1;font-weight:600}
.kick{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin-top:3px}
.spacer{flex:1}
.ctrls{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
select{appearance:none;-webkit-appearance:none;background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 32px 8px 12px;font:inherit;font-size:12.5px;font-weight:500;color:var(--ink);cursor:pointer;
  background-image:linear-gradient(45deg,transparent 50%,#7d6f64 50%),linear-gradient(135deg,#7d6f64 50%,transparent 50%);
  background-position:calc(100% - 16px) 17px,calc(100% - 11px) 17px;background-size:5px 5px;background-repeat:no-repeat}
select:focus{outline:2px solid var(--red);outline-offset:1px}
.langs{display:flex;padding:3px;gap:2px;background:#f2ead9;border-radius:9px}
.lang{border:0;cursor:pointer;padding:8px 13px;border-radius:7px;font:inherit;font-size:12px;font-weight:600;letter-spacing:.06em;background:transparent;color:var(--muted);transition:all .15s}
.lang.on{background:var(--red);color:#fff}
.tabbar{display:flex;gap:4px;overflow:auto;padding-bottom:0}
.tabbar::-webkit-scrollbar{height:0}
.tab{border:0;border-bottom:2px solid transparent;background:transparent;cursor:pointer;font:inherit;font-size:14px;font-weight:500;color:var(--muted);padding:12px 18px 13px;white-space:nowrap;transition:all .15s}
.tab:hover{color:var(--ink)}
.tab.on{border-bottom-color:var(--red);color:var(--red);font-weight:600}

main{padding:32px 0 72px}
.stack{display:flex;flex-direction:column;gap:28px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:24px}
h2{font-family:var(--hf);font-size:27px;font-weight:600;margin:0}
h3{font-family:var(--hf);font-size:22px;font-weight:600;margin:0 0 4px}
.sub{font-size:12.5px;color:var(--muted)}
.r{text-align:right}

/* hero */
.hero{border-radius:20px;background:var(--red);color:#fff;padding:34px 38px;display:flex;align-items:center;gap:44px;flex-wrap:wrap;box-shadow:0 18px 40px -28px rgba(196,15,21,.7)}
.hero-l{flex:1 1 380px;min-width:300px}
.hero-k{font-size:11px;letter-spacing:.2em;text-transform:uppercase;opacity:.75}
.hero-t{font-family:var(--hf);font-size:44px;line-height:1.1;font-weight:600;margin-top:10px}
.hero-b{font-size:14px;line-height:1.65;opacity:.9;margin-top:12px;max-width:52ch}
.hero-s{display:flex;gap:34px;margin-top:24px;flex-wrap:wrap}
.hs-l{font-size:10px;letter-spacing:.16em;text-transform:uppercase;opacity:.7}
.hs-v{font-family:var(--hf);font-size:28px;font-weight:600;margin-top:4px}
.hero-r{flex:0 0 auto;display:flex;align-items:center;gap:26px}
.ring{position:relative;width:200px;height:200px}
.ring svg{width:200px;height:200px;transform:rotate(-90deg)}
.ring-c{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-v{font-family:var(--hf);font-size:52px;font-weight:600;line-height:1}
.ring-u{font-size:10px;letter-spacing:.18em;text-transform:uppercase;opacity:.8;margin-top:2px}
.ring-meta{max-width:170px}
.ring-meta .k{font-size:12px;letter-spacing:.16em;text-transform:uppercase;opacity:.75}
.ring-meta .v{font-size:20px;font-weight:600;margin-top:6px;color:var(--gold)}
.ring-meta .n{font-size:12.5px;line-height:1.6;opacity:.85;margin-top:8px}
@media(max-width:900px){.hero{padding:26px 24px;gap:24px}.hero-t{font-size:34px}.hero-r{width:100%;justify-content:flex-start}}

/* stats */
.head-row{display:flex;align-items:baseline;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.grid4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media(max-width:1100px){.grid4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:560px){.grid4{grid-template-columns:1fr}}
.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 18px 14px;display:flex;flex-direction:column;gap:10px;transition:box-shadow .2s,transform .2s}
.stat:hover{box-shadow:0 8px 24px -18px rgba(42,33,28,.5);transform:translateY(-1px)}
.stat-top{display:flex;align-items:flex-start;justify-content:space-between;gap:8px}
.stat-l{font-size:11.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);line-height:1.4}
.stat-d{font-size:11.5px;font-weight:700;padding:3px 7px;border-radius:6px;white-space:nowrap}
.stat-v{font-family:var(--hf);font-size:34px;font-weight:600;line-height:1;letter-spacing:-.01em}
.spark{width:100%;height:34px;display:block}
.stat-n{font-size:11.5px;color:var(--muted);border-top:1px solid #f2ead9;padding-top:9px}

/* two-col */
.two{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start}
.two-eq{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px}
@media(max-width:1000px){.two,.two-eq{grid-template-columns:1fr}}

/* comparison */
.cmp-head,.cmp-row{display:grid;grid-template-columns:1.4fr .9fr .9fr .8fr}
.cmp-head{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);padding-bottom:9px;border-bottom:1px solid var(--line)}
.cmp-row{padding:12px 0;border-bottom:1px solid #f6efe2;align-items:center}
.cmp-row:last-child{border-bottom:0}
.cmp-m{font-size:13.5px;font-weight:500}
.cmp-now{font-size:14.5px;font-weight:600}
.cmp-prev{font-size:14px;color:var(--muted)}
.cmp-d{font-size:13px;font-weight:700}

/* diverging bars */
.bar-row{display:grid;grid-template-columns:120px 1fr 60px;align-items:center;gap:12px;margin-bottom:12px}
.bar-l{font-size:12px;color:var(--muted);text-align:right;line-height:1.3}
.bar-track{position:relative;height:20px;background:#faf5ec;border-radius:4px;display:flex}
.bar-neg{width:50%;height:100%;display:flex;justify-content:flex-end}
.bar-neg>div{height:100%;border-radius:4px 0 0 4px;opacity:.9;transition:width .4s}
.bar-pos{width:50%;height:100%}
.bar-pos>div{height:100%;border-radius:0 4px 4px 0;opacity:.9;transition:width .4s}
.bar-mid{position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:#dfd2bd}
.bar-p{font-size:12px;font-weight:700;text-align:right}

/* ratio */
.ratio-nums{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:10px}
.ratio-big{font-family:var(--hf);font-size:40px;font-weight:600;line-height:1}
.ratio-lbl{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.ratio-bar{display:flex;height:34px;border-radius:8px;overflow:hidden;background:#faf5ec}
.ratio-bar>div{transition:width .5s}
.ratio-det{display:flex;justify-content:space-between;margin-top:12px;font-size:12px;color:var(--muted)}
.ratio-note{margin-top:18px;background:var(--soft);border-radius:10px;padding:14px 16px;font-size:13px;line-height:1.6;color:#5c4f45}

/* frequency */
.freq-row{display:flex;align-items:center;gap:28px;margin-top:8px;flex-wrap:wrap}
.freq-gauge{position:relative;width:250px;height:150px;flex:0 0 auto}
.freq-gauge svg{width:250px;height:140px;display:block}
.freq-scale{display:flex;justify-content:space-between;font-size:10.5px;color:var(--muted);padding:0 14px;margin-top:-4px}
.freq-v{font-family:var(--hf);font-size:46px;font-weight:600;line-height:1}
.freq-u{font-size:11.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:6px}
.freq-vd{display:inline-block;margin-top:12px;font-size:12px;font-weight:700;padding:5px 10px;border-radius:6px}
.freq-bands{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.fb{flex:1;min-width:150px;border:1px solid var(--line);border-radius:10px;padding:12px;transition:all .2s}
.fb-r{font-size:12px;font-weight:700}
.fb-l{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.45}

/* heatmap */
.heat-cols{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(5,minmax(0,1fr));gap:6px;align-items:center}
.hc{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);text-align:center}
.heat-row{display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(5,minmax(0,1fr));gap:6px;align-items:center;margin-top:6px}
.hr-n{font-size:12.5px;font-weight:500;padding-right:12px;line-height:1.35;display:flex;flex-direction:column;gap:3px}
.hr-o{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hcell{border-radius:8px;padding:14px 6px;text-align:center;font-size:13.5px;font-weight:600}
.legend{display:flex;gap:18px;margin-top:18px;font-size:11.5px;color:var(--muted);align-items:center;flex-wrap:wrap}
.lg{display:flex;align-items:center;gap:7px}
.lg span{width:12px;height:12px;border-radius:3px;display:inline-block}
@media(max-width:900px){.heat-cols,.heat-row{grid-template-columns:minmax(140px,1.4fr) repeat(5,minmax(0,1fr));gap:4px}.hcell{padding:10px 3px;font-size:11.5px}}

/* campaign table */
.camp-head,.camp-row{display:grid;grid-template-columns:2.4fr 1.1fr .9fr .8fr .9fr .9fr .7fr;gap:10px}
.camp-head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.camp-row{padding:14px 0;border-bottom:1px solid #f6efe2;align-items:center;font-size:13px}
.camp-row:last-child{border-bottom:0}
.c-n{font-weight:500;line-height:1.35;word-break:break-word}
.obj{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.obj.awareness{background:#fff4dd;color:#8a6a12}
.obj.engagement{background:#fdeced;color:var(--red)}
@media(max-width:1000px){.camp-head,.camp-row{grid-template-columns:1.8fr 1fr .8fr .8fr .8fr .8fr;font-size:12px}.camp-head>div:nth-child(4),.camp-row>div:nth-child(4){display:none}}

/* platforms */
.plats{display:flex;gap:14px;justify-content:space-between;flex-wrap:wrap}
.plat{flex:1;min-width:110px;text-align:center}
.plat-ring{position:relative;width:100%;aspect-ratio:1/1;max-width:118px;margin:0 auto}
.plat-ring svg{width:100%;height:100%}
.plat-pct{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--hf);font-size:24px;font-weight:600}
.plat-n{font-size:12.5px;font-weight:600;margin-top:10px}
.plat-s{font-size:11.5px;color:var(--muted);margin-top:3px}

/* placements */
.pl-head,.pl-row{display:grid;grid-template-columns:1.6fr .9fr .8fr .8fr .9fr;gap:10px}
.pl-head{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:10px;border-bottom:1px solid var(--line)}
.pl-row{padding:13px 0;border-bottom:1px solid #f6efe2;align-items:center;font-size:13px}
.pl-row:last-child{border-bottom:0}

/* creatives */
.crs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
@media(max-width:820px){.crs{grid-template-columns:1fr}}
.cr{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;transition:box-shadow .2s,transform .2s}
.cr:hover{box-shadow:0 14px 34px -24px rgba(42,33,28,.55);transform:translateY(-2px)}
.cr.good{border-color:#bfe0c8}
.cr.bad{border-color:#f2c9cb}
.cr-head{display:flex;align-items:center;justify-content:space-between;padding:12px 18px;font-size:11.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.cr-fmt{font-weight:500;opacity:.75;letter-spacing:.06em}
.cr-body{padding:18px}
.cr-name{font-family:var(--hf);font-size:21px;font-weight:600;line-height:1.25;word-break:break-word}
.cr-id{font-size:11px;color:var(--muted);font-family:ui-monospace,monospace;margin-top:4px}
.cr-metrics{display:grid;grid-template-columns:1fr 1fr;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:16px}
.crm{background:#fff;padding:11px 13px;display:flex;flex-direction:column;gap:2px}
.crm span{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.crm b{font-size:15px;font-weight:600}
.cr-link{display:inline-block;margin-top:16px;font-size:12.5px;font-weight:600;color:var(--red);text-decoration:none;border-bottom:1px solid rgba(196,15,21,.3);padding-bottom:1px}
.cr-link:hover{border-bottom-color:var(--red)}

/* benchmark */
.bms{display:flex;flex-direction:column;gap:20px}
.bm{display:grid;grid-template-columns:150px 1fr;gap:18px;align-items:center}
@media(max-width:700px){.bm{grid-template-columns:1fr;gap:8px}}
.bm-l{font-size:13px;font-weight:600}
.bm-bars{display:flex;flex-direction:column;gap:7px}
.bm-line{display:grid;grid-template-columns:70px 1fr 90px;gap:12px;align-items:center}
.bm-tag{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bm-track{height:14px;background:#faf5ec;border-radius:4px;overflow:hidden}
.bm-track>div{height:100%;border-radius:4px;transition:width .5s}
.bm-line b{font-size:13px;text-align:right}
.vds{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px;margin-top:24px}
@media(max-width:760px){.vds{grid-template-columns:1fr}}
.vd{border:1px solid;border-radius:14px;padding:18px}
.vd-k{font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:700}
.vd-t{font-family:var(--hf);font-size:20px;font-weight:600;margin-top:6px}
.vd-b{font-size:13px;line-height:1.6;color:#5c4f45;margin-top:6px}

/* insights */
.inss{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media(max-width:860px){.inss{grid-template-columns:1fr}}
.ins{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.ins-top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.ins-n{font-family:var(--hf);font-size:15px;font-weight:600;color:var(--muted)}
.ins-tag{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:6px}
.ins-t{font-family:var(--hf);font-size:19px;font-weight:600;line-height:1.3}
.ins-b{font-size:13px;line-height:1.65;color:#5c4f45;margin-top:8px}

/* next steps */
.nss{display:flex;flex-direction:column;gap:14px}
.ns{display:grid;grid-template-columns:44px 1fr;gap:16px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;transition:border-color .2s}
.ns:hover{border-color:#dfcfae}
.ns-n{width:34px;height:34px;border-radius:50%;background:var(--red);color:#fff;display:grid;place-items:center;font-family:var(--hf);font-size:17px;font-weight:600}
.ns-t{font-family:var(--hf);font-size:20px;font-weight:600;line-height:1.25}
.ns-b{font-size:13px;line-height:1.65;color:#5c4f45;margin-top:6px}
.ns-m{display:flex;gap:8px;margin-top:10px;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:24px 0;display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);flex-wrap:wrap;gap:8px}
</style>
</head>
<body>

<header class="hdr">
  <div class="wrap">
    <div class="hdr-in">
      <div style="display:flex;align-items:center;gap:14px;min-width:0">
        <div class="logo">A</div>
        <div style="min-width:0">
          <div class="brand">Alfredo</div>
          <div class="kick" id="kicker"></div>
        </div>
      </div>
      <div class="spacer"></div>
      <div class="ctrls">
        <div class="fld">
          <label for="periodSel" id="periodLabel"></label>
          <select id="periodSel" onchange="onPeriod(this.value)"></select>
        </div>
        <div class="fld">
          <label for="compareSel" id="compareLabel"></label>
          <select id="compareSel" onchange="onCompare(this.value)"></select>
        </div>
        <div class="langs">
          <button class="lang on" id="btnEN" onclick="setLang('en')">EN</button>
          <button class="lang" id="btnTH" onclick="setLang('th')">TH</button>
        </div>
      </div>
    </div>
    <div class="tabbar" id="tabs"></div>
  </div>
</header>

<main class="wrap">

  <!-- OVERVIEW -->
  <section id="pOverview" class="stack">
    <div class="hero">
      <div class="hero-l">
        <div class="hero-k" id="heroKicker"></div>
        <div class="hero-t" id="heroTitle"></div>
        <div class="hero-b" id="heroBody"></div>
        <div class="hero-s" id="heroStats"></div>
      </div>
      <div class="hero-r">
        <div class="ring">
          <svg viewBox="0 0 120 120">
            <circle cx="60" cy="60" r="52" fill="none" stroke="rgba(255,255,255,.22)" stroke-width="13"></circle>
            <circle id="scoreArc" cx="60" cy="60" r="52" fill="none" stroke="#ffc045" stroke-width="13" stroke-linecap="round" stroke-dasharray="0 327"></circle>
          </svg>
          <div class="ring-c"><div>
            <div class="ring-v" id="score">0</div>
            <div class="ring-u">/ 100</div>
          </div></div>
        </div>
        <div class="ring-meta">
          <div class="k" id="efficiencyLbl"></div>
          <div class="v" id="scoreVerdict"></div>
          <div class="n" id="scoreNote"></div>
        </div>
      </div>
    </div>

    <div>
      <div class="head-row">
        <h2 id="keyMetrics"></h2>
        <span class="sub" id="vsPrev"></span>
      </div>
      <div class="grid4" id="stats"></div>
    </div>

    <div class="two">
      <div class="card">
        <h3 id="compareTitle"></h3>
        <div class="sub" id="compareSub" style="margin-bottom:16px"></div>
        <div class="cmp-head" id="cmpHead"></div>
        <div id="cmpRows"></div>
      </div>
      <div class="card">
        <h3 id="normTitle"></h3>
        <div class="sub" id="normSub" style="margin-bottom:18px"></div>
        <div id="bars"></div>
      </div>
    </div>

    <div class="two-eq">
      <div class="card">
        <h3 id="ratioTitle"></h3>
        <div class="sub" id="ratioSub" style="margin-bottom:22px"></div>
        <div class="ratio-nums">
          <div><div class="ratio-big" style="color:var(--red)" id="engPct"></div>
               <div class="ratio-lbl" id="engLbl"></div></div>
          <div style="text-align:right"><div class="ratio-big" style="color:#c79b3a" id="awarePct"></div>
               <div class="ratio-lbl" id="awareLbl"></div></div>
        </div>
        <div class="ratio-bar">
          <div id="engBar" style="background:var(--red)"></div>
          <div id="awareBar" style="background:var(--gold)"></div>
        </div>
        <div class="ratio-det"><span id="engDetail"></span><span id="awareDetail"></span></div>

const thb  = n => "฿" + (+n||0).toLocaleString("en-US",{maximumFractionDigits:(+n<10?2:0)});
const num  = n => (+n||0).toLocaleString("en-US");
const pctS = n => (+n||0).toFixed(2) + "%";
const kNum = n => { n=+n||0; return n>=1e6 ? (n/1e6).toFixed(2)+"M" : n>=1e3 ? Math.round(n/1e3)+"K" : num(n); };

function delta(now, prev, lowerBetter){
  if(!prev) return {txt:"—", good:null, pct:0};
  const d = ((now-prev)/Math.abs(prev))*100;
  const good = lowerBetter ? d < 0 : d > 0;
  return { txt:(d>=0?"+":"") + d.toFixed(1) + "%", good, pct:d };
}
const GOOD="#1e6e35", BAD="#c40f15", NEU="#7d6f64";
const GOODBG="#eaf5ec", BADBG="#fdeced", NEUBG="#f4efe6";
const dColor = g => g===null?NEU : g?GOOD:BAD;
const dBg    = g => g===null?NEUBG: g?GOODBG:BADBG;

/* Efficiency score — engagement/awareness weighted, no conversion metrics */
function effScore(m){
  const a = m.account;
  const cpmS  = Math.max(0, Math.min(100, (1 - (a.cpm-6)/20) * 100));
  const cpcS  = Math.max(0, Math.min(100, (1 - a.cpc/6) * 100));
  const ctrS  = Math.min(100, (a.ctr/2.5) * 100);
  const cpeS  = Math.max(0, Math.min(100, (1 - a.costPerEng/3) * 100));
  const freqS = a.frequency>=1.5 && a.frequency<=2.5 ? 100
              : a.frequency<1.5 ? 70 : Math.max(0, 100-(a.frequency-2.5)*40);
  return Math.round(cpmS*0.18 + cpcS*0.22 + ctrS*0.22 + cpeS*0.28 + freqS*0.10);
}
function scoreVerdict(s){
  if(LANG==="th") return s>=75?"ดีเยี่ยม":s>=55?"ดี":s>=40?"พอใช้":"ต้องปรับปรุง";
  return s>=75?"Excellent":s>=55?"Good":s>=40?"Fair":"Needs work";
}

/* Sparkline across all months (oldest → newest) */
function sparkFor(field){
  const keys = [...MONTH_KEYS].reverse();
  return keys.map(k => +MONTHS[k].account[field] || 0);
}
function sparkPoints(vals, w=120, h=34){
  if(vals.length<2) vals=[vals[0]||0, vals[0]||0];
  const mn=Math.min(...vals), mx=Math.max(...vals), rg=(mx-mn)||1;
  return vals.map((v,i)=>{
    const x=(i/(vals.length-1))*w;
    const y=h-2-((v-mn)/rg)*(h-6);
    return x.toFixed(1)+","+y.toFixed(1);
  }).join(" ");
}
function areaPoints(vals,w=120,h=34){
  return "0,"+h+" "+sparkPoints(vals,w,h)+" "+w+","+h;
}

/* Heatmap scoring */
function heatCell(val, thresholds, lowerBetter){
  const [t1,t2] = thresholds;
  let level;
  if(lowerBetter) level = val<=t1 ? 0 : val<=t2 ? 1 : 2;
  else            level = val>=t2 ? 0 : val>=t1 ? 1 : 2;
  const bgs=["#e6f4ea","#fdf3dc","#fbe3e4"], fgs=["#1e6e35","#8a6a12","#c40f15"];
  return {bg:bgs[level], fg:fgs[level]};
}

function splitByObj(m){
  const aw = m.campaigns.filter(c=>c.obj==="awareness");
  const en = m.campaigns.filter(c=>c.obj==="engagement");
  const sum = (arr,f) => arr.reduce((s,c)=>s+(+c[f]||0),0);
  return {
    aw, en,
    awSpend:sum(aw,"spend"), enSpend:sum(en,"spend"),
    awEng:sum(aw,"engagements"), enEng:sum(en,"engagements"),
    awReach:sum(aw,"reach"), enReach:sum(en,"reach"),
  };
}

      body:`${thb(worstAny.costPerEng)} per engagement on ${thb(worstAny.spend)} spend is the biggest single drag on blended efficiency. Rework the opening frame and first-line copy, then re-test at a small budget before committing.`},
    {title:`Move engagement share toward 35–40%`, when:"Next cycle", owner:"Planning",
      body:`Engagement currently sits at ${engShare.toFixed(0)}% of budget. Since conversions cannot be tracked, engagement volume and cost per engagement are your clearest quality signals — weighting toward them gives you sharper feedback each month.`},
    cheapPl && {title:`Shift awareness reach to ${cheapPl.name}`, when:"Next cycle", owner:"Media buyer",
      body:`At ฿${cheapPl.cpm.toFixed(1)} CPM it is the cheapest impression source in the account. Route 15–20% more of the awareness budget here to lift reach without raising total spend.`},
    deadPl.length ? {title:`Trim ${deadPl.map(p=>p.name).join(", ")}`, when:"Immediate", owner:"Media buyer",
      body:`These placements are absorbing budget with negligible CTR. Removing them lets Meta redistribute delivery to placements that are already performing.`} : null,
    {title:`Log ad recall lift alongside spend`, when:"Ongoing", owner:"Reporting",
      body:`With no conversion signal, estimated ad recall lift is the closest proxy for awareness effectiveness. Track it monthly so awareness campaigns are judged on their own objective rather than on click metrics they were never optimised for.`},
  ].filter(Boolean);

  const TH=[
    bestEng && {title:`เพิ่มงบ ${bestEng.name}`, when:"สัปดาห์นี้", owner:"ทีมซื้อสื่อ",
      body:`ต้นทุนต่อการมีส่วนร่วม ${thb(bestEng.costPerEng)} และ CTR ${pctS(bestEng.ctr)} คือสินทรัพย์ที่มีประสิทธิภาพที่สุด เพิ่มงบรายวัน 2–3 เท่า และใช้แนวทางครีเอทีฟเดียวกันกับโพสต์สินค้าถัดไป`},
    worstAny && {title:`ทำใหม่หรือหยุด ${worstAny.name}`, when:"ก่อนรอบถัดไป", owner:"ครีเอทีฟ",
      body:`ต้นทุน ${thb(worstAny.costPerEng)} ต่อการมีส่วนร่วม บนงบ ${thb(worstAny.spend)} คือจุดที่ฉุดประสิทธิภาพรวมมากที่สุด ปรับเฟรมแรกและข้อความบรรทัดแรก แล้วทดสอบด้วยงบน้อยก่อน`},
    {title:`ปรับสัดส่วน Engagement ไปที่ 35–40%`, when:"รอบถัดไป", owner:"วางแผน",
      body:`ปัจจุบัน Engagement อยู่ที่ ${engShare.toFixed(0)}% ของงบ เนื่องจากไม่สามารถติดตามยอดขายได้ ปริมาณการมีส่วนร่วมและต้นทุนต่อการมีส่วนร่วมคือสัญญาณคุณภาพที่ชัดที่สุด`},
    cheapPl && {title:`ย้ายงบ Awareness ไปที่ ${cheapPl.name}`, when:"รอบถัดไป", owner:"ทีมซื้อสื่อ",
      body:`CPM ฿${cheapPl.cpm.toFixed(1)} คือแหล่งการแสดงผลที่ถูกที่สุดในบัญชี โยกงบ Awareness มาเพิ่ม 15–20% เพื่อเพิ่มการเข้าถึงโดยไม่เพิ่มงบรวม`},
    deadPl.length ? {title:`ตัด ${deadPl.map(p=>p.name).join(", ")}`, when:"ทันที", owner:"ทีมซื้อสื่อ",
      body:`ตำแหน่งเหล่านี้ใช้งบโดยมี CTR แทบเป็นศูนย์ การลบออกจะทำให้ Meta กระจายการแสดงผลไปยังตำแหน่งที่ทำได้ดีอยู่แล้ว`} : null,
    {title:`บันทึกการจดจำโฆษณาควบคู่กับค่าใช้จ่าย`, when:"ต่อเนื่อง", owner:"รายงาน",
      body:`เมื่อไม่มีสัญญาณยอดขาย การจดจำโฆษณา (ประมาณการ) คือตัวแทนที่ใกล้เคียงที่สุดของประสิทธิผล Awareness ควรติดตามทุกเดือนเพื่อวัดผลตามวัตถุประสงค์จริง`},
  ].filter(Boolean);

  return LANG==="th" ? TH : EN;
}


/* ============================================================
   RENDERERS
   ============================================================ */
const $ = id => document.getElementById(id);

function renderChrome(){
  const T_=t();
  $("kicker").textContent = T_.kicker;
  $("periodLabel").textContent = T_.periodLabel;
  $("compareLabel").textContent = T_.compareLabel;
  $("footerLeft").textContent = T_.footerLeft;
  $("footerRight").textContent = T_.footerRight;

  // month selectors
  const opts = k => MONTH_KEYS.map(mk =>
    `<option value="${mk}" ${mk===k?"selected":""}>${MONTHS[mk].label[LANG]} · ${MONTHS[mk].range[LANG]}</option>`
  ).join("");
  $("periodSel").innerHTML  = opts(CUR);
  $("compareSel").innerHTML = opts(CMP);

  // tabs
  $("tabs").innerHTML = T_.tabs.map((label,i)=>
    `<button class="tab ${i===TAB?"on":""}" onclick="setTab(${i})">${label}</button>`
  ).join("");

  // lang buttons
  $("btnEN").className = "lang" + (LANG==="en"?" on":"");
  $("btnTH").className = "lang" + (LANG==="th"?" on":"");

  // panels
  ["pOverview","pPerformance","pCreatives","pBenchmark","pStrategy"]
    .forEach((id,i)=> $(id).style.display = i===TAB ? "block" : "none");
}

/* ---------- OVERVIEW ---------- */
function renderOverview(){
  const T_=t(), m=cur(), p=cmp(), a=m.account, pa=p.account;
  const score=effScore(m), circ=2*Math.PI*52;

  const heroTitle = LANG==="th"
    ? `${m.label.th} · ${thb(a.spend)}`
    : `${m.label.en} · ${thb(a.spend)}`;
  const heroBody = LANG==="th"
    ? `เข้าถึง ${kNum(a.reach)} คน สร้างการมีส่วนร่วม ${num(a.engagements)} ครั้ง ที่ต้นทุน ${thb(a.costPerEng)} ต่อครั้ง เทียบกับ ${p.label.th}`
    : `Reached ${kNum(a.reach)} people and generated ${num(a.engagements)} engagements at ${thb(a.costPerEng)} each, compared with ${p.label.en}.`;

  $("heroKicker").textContent = T_.heroKicker;
  $("heroTitle").textContent  = heroTitle;
  $("heroBody").textContent   = heroBody;
  $("score").textContent      = score;
  $("scoreArc").setAttribute("stroke-dasharray", `${(score/100*circ).toFixed(1)} ${circ.toFixed(1)}`);
  $("efficiencyLbl").textContent = T_.efficiency;
  $("scoreVerdict").textContent  = scoreVerdict(score);
  $("scoreNote").textContent = LANG==="th"
    ? "คำนวณจาก CPM, CPC, CTR, ต้นทุนต่อการมีส่วนร่วม และความถี่ — ไม่รวมตัวชี้วัดยอดขาย"
    : "Weighted from CPM, CPC, CTR, cost per engagement and frequency. No conversion metrics are used.";

  $("heroStats").innerHTML = [
    {l:T_.stReach, v:kNum(a.reach)},
    {l:T_.stEng,   v:num(a.engagements)},
    {l:T_.stCpe,   v:thb(a.costPerEng)},
  ].map(h=>`<div><div class="hs-l">${h.l}</div><div class="hs-v">${h.v}</div></div>`).join("");

  // stat cards
  $("keyMetrics").textContent = T_.keyMetrics;
  $("vsPrev").textContent = T_.vsPrev + " · " + p.label[LANG];
  const defs=[
    {k:"spend",       l:T_.stSpend,  f:thb,  lb:null},
    {k:"reach",       l:T_.stReach,  f:kNum, lb:false},
    {k:"impressions", l:T_.stImpr,   f:kNum, lb:false},
    {k:"engagements", l:T_.stEng,    f:num,  lb:false},
    {k:"costPerEng",  l:T_.stCpe,    f:thb,  lb:true},
    {k:"cpm",         l:T_.stCpm,    f:thb,  lb:true},
    {k:"ctr",         l:T_.stCtr,    f:pctS, lb:false},
    {k:"frequency",   l:T_.stFreq,   f:v=>(+v).toFixed(2)+"×", lb:null},
  ];
  $("stats").innerHTML = defs.map(d=>{
    const nowV=+a[d.k]||0, prevV=+pa[d.k]||0;
    const dl=delta(nowV,prevV,d.lb);
    const sp=sparkFor(d.k);
    const stroke = dl.good===null?"#c9b89a":dl.good?GOOD:BAD;
    const fill   = dl.good===null?"rgba(201,184,154,.15)":dl.good?"rgba(30,110,53,.12)":"rgba(196,15,21,.10)";
    return `<div class="stat">
      <div class="stat-top">
        <div class="stat-l">${d.l}</div>
        <div class="stat-d" style="color:${dColor(dl.good)};background:${dBg(dl.good)}">${dl.txt}</div>
      </div>
      <div class="stat-v">${d.f(nowV)}</div>
      <svg viewBox="0 0 120 34" preserveAspectRatio="none" class="spark">
        <polygon points="${areaPoints(sp)}" fill="${fill}"></polygon>
        <polyline points="${sparkPoints(sp)}" fill="none" stroke="${stroke}" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"></polyline>
      </svg>
      <div class="stat-n">${T_.lastPeriod}: ${d.f(prevV)}</div>
    </div>`;
  }).join("");

  // comparison table
  $("compareTitle").textContent = T_.compareTitle;
  $("compareSub").textContent   = `${m.range[LANG]}  ·  ${p.range[LANG]}`;
  $("cmpHead").innerHTML = `<div>${T_.metric}</div><div class="r">${T_.thisPeriod}</div><div class="r">${T_.lastPeriod}</div><div class="r">${T_.change}</div>`;
  const rows=[
    {l:T_.stSpend, k:"spend", f:thb, lb:null},
    {l:T_.stReach, k:"reach", f:kNum, lb:false},
    {l:T_.stImpr,  k:"impressions", f:kNum, lb:false},
    {l:T_.stEng,   k:"engagements", f:num, lb:false},
    {l:T_.stCpe,   k:"costPerEng", f:thb, lb:true},
    {l:T_.stCpm,   k:"cpm", f:thb, lb:true},
    {l:T_.stCpc,   k:"cpc", f:thb, lb:true},
    {l:T_.stCtr,   k:"ctr", f:pctS, lb:false},
    {l:T_.stFreq,  k:"frequency", f:v=>(+v).toFixed(2)+"×", lb:null},
  ];
  $("cmpRows").innerHTML = rows.map(r=>{
    const dl=delta(+a[r.k]||0, +pa[r.k]||0, r.lb);
    return `<div class="cmp-row">
      <div class="cmp-m">${r.l}</div>
      <div class="r cmp-now">${r.f(a[r.k])}</div>
      <div class="r cmp-prev">${r.f(pa[r.k])}</div>
      <div class="r cmp-d" style="color:${dColor(dl.good)}">${dl.txt}</div>
    </div>`;
  }).join("");

  // diverging bars
  $("normTitle").textContent = T_.normTitle;
  $("normSub").textContent   = T_.normSub;
  const barDefs=[
    {l:T_.stSpend,k:"spend",lb:null},{l:T_.stReach,k:"reach",lb:false},
    {l:T_.stImpr,k:"impressions",lb:false},{l:T_.stEng,k:"engagements",lb:false},
    {l:T_.stCpe,k:"costPerEng",lb:true},{l:T_.stCpm,k:"cpm",lb:true},
    {l:T_.stCpc,k:"cpc",lb:true},{l:T_.stCtr,k:"ctr",lb:false},
  ];
  const maxAbs=Math.max(...barDefs.map(b=>Math.abs(delta(+a[b.k]||0,+pa[b.k]||0,b.lb).pct)),1);
  $("bars").innerHTML = barDefs.map(b=>{
    const dl=delta(+a[b.k]||0,+pa[b.k]||0,b.lb);
    const w=(Math.abs(dl.pct)/maxAbs*100).toFixed(1)+"%";
    const col=dColor(dl.good);
    return `<div class="bar-row">
      <div class="bar-l">${b.l}</div>
      <div class="bar-track">
        <div class="bar-neg"><div style="width:${dl.pct<0?w:"0%"};background:${col}"></div></div>
        <div class="bar-mid"></div>
        <div class="bar-pos"><div style="width:${dl.pct>0?w:"0%"};background:${col}"></div></div>
      </div>
      <div class="bar-p" style="color:${col}">${dl.txt}</div>
    </div>`;
  }).join("");

  // objective split
  const s=splitByObj(m), tot=s.awSpend+s.enSpend||1;
  const engP=(s.enSpend/tot*100), awP=(s.awSpend/tot*100);
  $("ratioTitle").textContent=T_.ratioTitle;
  $("ratioSub").textContent=T_.ratioSub;
  $("engPct").textContent=engP.toFixed(0)+"%";
  $("awarePct").textContent=awP.toFixed(0)+"%";
  $("engLbl").textContent=T_.engagement;
  $("awareLbl").textContent=T_.awareness;
  $("engBar").style.width=engP+"%";
  $("awareBar").style.width=awP+"%";
  $("engDetail").textContent=`${thb(s.enSpend)} · ${num(s.enEng)} ${LANG==="th"?"การมีส่วนร่วม":"engagements"}`;
  $("awareDetail").textContent=`${thb(s.awSpend)} · ${kNum(s.awReach)} ${LANG==="th"?"เข้าถึง":"reach"}`;
  $("ratioNote").textContent=T_.ratioNote;

  // frequency gauge
  const f=a.frequency;
  $("freqTitle").textContent=T_.freqTitle;
  $("freqSub").textContent=T_.freqSub;
  $("freqVal").textContent=f.toFixed(2);
  $("freqUnit").textContent=T_.freqUnit;
  const fCol = f>2.5?BAD : f<1.5?"#c79b3a" : GOOD;
  const fBg  = f>2.5?BADBG : f<1.5?"#fdf3dc" : GOODBG;
  const fVer = f>2.5?T_.freqHigh : f<1.5?T_.freqLow : T_.freqGood;
  $("freqVal").style.color=fCol;
  $("freqVerdict").textContent=fVer;
  $("freqVerdict").style.color=fCol;
  $("freqVerdict").style.background=fBg;
  const arcLen=Math.PI*100, frac=Math.min(f/6,1);
  $("freqArc").setAttribute("stroke",fCol);
  $("freqArc").setAttribute("stroke-dasharray",`${(arcLen*frac).toFixed(1)} ${arcLen.toFixed(1)}`);
  const ang=Math.PI-(frac*Math.PI);
  $("needle").setAttribute("x2",(125+82*Math.cos(ang)).toFixed(1));
  $("needle").setAttribute("y2",(125-82*Math.sin(ang)).toFixed(1));
  $("freqBands").innerHTML=T_.freqBands.map((b,i)=>{
    const active=(i===0&&f<1.5)||(i===1&&f>=1.5&&f<=2.5)||(i===2&&f>2.5);
    const c=[ "#c79b3a", GOOD, BAD ][i];
    return `<div class="fb ${active?"on":""}" style="${active?`border-color:${c};background:${i===0?"#fdf3dc":i===1?GOODBG:BADBG}`:""}">
      <div class="fb-r" style="color:${active?c:"#7d6f64"}">${b.range}</div>
      <div class="fb-l">${b.label}</div></div>`;
  }).join("");
}

/* ---------- PERFORMANCE ---------- */
function renderPerformance(){
  const T_=t(), m=cur();
  $("heatTitle").textContent=T_.heatTitle;
  $("heatSub").textContent=T_.heatSub;
  $("heatCols").innerHTML = `<div></div>` + T_.heatCols.map(c=>`<div class="hc">${c}</div>`).join("");

  $("heatRows").innerHTML = m.campaigns.map(c=>{
    const cells=[
      {v:thb(c.spend),         s:heatCell(c.spend,[800,2500],true)},
      {v:"฿"+c.cpm.toFixed(1), s:heatCell(c.cpm,[12,25],true)},
      {v:c.frequency.toFixed(2),s:heatCell(c.frequency,[2.0,2.8],true)},
      {v:pctS(c.ctr),          s:heatCell(c.ctr,[0.5,3],false)},
      {v:thb(c.costPerEng),    s:heatCell(c.costPerEng,[1.0,6],true)},
    ];
    return `<div class="heat-row">
      <div class="hr-n" title="${c.name}">${c.name}<span class="hr-o ${c.obj}">${c.obj==="awareness"?T_.awareness:T_.engagement}</span></div>
      ${cells.map(x=>`<div class="hcell" style="background:${x.s.bg};color:${x.s.fg}">${x.v}</div>`).join("")}
    </div>`;
  }).join("");
  $("heatLegend").innerHTML = T_.heatLegend.map((l,i)=>{
    const bg=["#e6f4ea","#fdf3dc","#fbe3e4"][i];
    return `<div class="lg"><span style="background:${bg}"></span>${l.label}</div>`;
  }).join("");

  // campaign table — no ROAS/CPA
  $("campTable").textContent=T_.campTable;
  $("campHead").innerHTML =
    `<div>${T_.campaign}</div><div>${T_.objective}</div>
     <div class="r">${T_.spend}</div><div class="r">${T_.stReach}</div>
     <div class="r">${T_.stEng}</div><div class="r">${T_.cpe}</div>
     <div class="r">${T_.stCtr}</div>`;
  $("campRows").innerHTML = [...m.campaigns].sort((a,b)=>b.spend-a.spend).map(c=>{
    const good = c.obj==="engagement" ? c.costPerEng<1.0 : c.costPerEng<8;
    return `<div class="camp-row">
      <div class="c-n">${c.name}</div>
      <div><span class="obj ${c.obj}">${c.obj==="awareness"?T_.awareness:T_.engagement}</span></div>
      <div class="r">${thb(c.spend)}</div>
      <div class="r">${kNum(c.reach)}</div>
      <div class="r">${num(c.engagements)}</div>
      <div class="r" style="font-weight:600;color:${good?GOOD:BAD}">${thb(c.costPerEng)}</div>
      <div class="r">${pctS(c.ctr)}</div>
    </div>`;
  }).join("");

  // platform donuts — cost per engagement instead of ROAS
  const plats={};
  m.placements.forEach(p=>{
    if(!plats[p.platform]) plats[p.platform]={spend:0,eng:0,cpeSum:0,n:0};
    plats[p.platform].spend+=p.spend;
    plats[p.platform].cpeSum+=p.costPerEng; plats[p.platform].n++;
  });
  const totSpend=Object.values(plats).reduce((s,v)=>s+v.spend,0)||1;
  const colors={Facebook:"#c40f15",Instagram:"#ffc045",Messenger:"#7d6f64"};
  $("platformTitle").textContent=T_.platformTitle;
  $("platformSub").textContent=T_.platformSub;
  $("platforms").innerHTML=Object.entries(plats).map(([name,v])=>{
    const pct=v.spend/totSpend*100, circ=2*Math.PI*50;
    return `<div class="plat">
      <div class="plat-ring">
        <svg viewBox="0 0 120 120" style="transform:rotate(-90deg)">
          <circle cx="60" cy="60" r="50" fill="none" stroke="#f4ecdd" stroke-width="14"></circle>
          <circle cx="60" cy="60" r="50" fill="none" stroke="${colors[name]||"#999"}" stroke-width="14"
            stroke-linecap="round" stroke-dasharray="${(pct/100*circ).toFixed(1)} ${circ.toFixed(1)}"></circle>
        </svg>
        <div class="plat-pct">${pct.toFixed(0)}%</div>
      </div>
      <div class="plat-n">${name}</div>
      <div class="plat-s">${thb(v.spend)}</div>
      <div class="plat-s">${T_.cpe} ${thb(v.cpeSum/v.n)}</div>
    </div>`;
  }).join("");

  // placement table — cost per engagement instead of ROAS
  $("placementTitle").textContent=T_.placementTitle;
  $("plHead").innerHTML=`<div>${T_.placement}</div><div class="r">${T_.spend}</div>
    <div class="r">CTR</div><div class="r">CPM</div><div class="r">${T_.cpe}</div>`;
  $("plRows").innerHTML=[...m.placements].sort((a,b)=>b.spend-a.spend).map(p=>{
    const good=p.costPerEng<1.5;
    return `<div class="pl-row">
      <div>${p.name}</div>
      <div class="r">${thb(p.spend)}</div>
      <div class="r">${pctS(p.ctr)}</div>
      <div class="r">฿${p.cpm.toFixed(1)}</div>
      <div class="r" style="font-weight:600;color:${good?GOOD:NEU}">${thb(p.costPerEng)}</div>
    </div>`;
  }).join("");
}

/* ---------- CREATIVES ---------- */
function renderCreatives(){
  const T_=t(), m=cur(), cr=m.creatives;
  $("creativeTitle").textContent=T_.creativeTitle;
  $("creativeSub").textContent=T_.creativeSub;
  const slots=[
    {k:"bestEng",  lbl:T_.slotBestEng,  good:true},
    {k:"bestVideo",lbl:T_.slotBestVid,  good:true},
    {k:"worstEff", lbl:T_.slotWorstEff, good:false},
    {k:"worstCost",lbl:T_.slotWorstCost,good:false},
  ];
  $("creatives").innerHTML=slots.map(s=>{
    const c=cr[s.k]; if(!c) return "";
    const url=`https://www.facebook.com/adsmanager/reporting/view?act=${AD_ACCOUNT}&selected_ad_ids=${c.adId}`;
    const metrics=[
      {k:T_.spend, v:thb(c.spend)},
      {k:T_.stEng, v:num(c.engagements)},
      {k:T_.cpe,   v:thb(c.costPerEng)},
      {k:"CTR",    v:pctS(c.ctr)},
      {k:"CPC",    v:thb(c.cpc)},
    ];
    if(c.thruplays>0){
      metrics.push({k:LANG==="th"?"ดูวิดีโอจบ":"ThruPlays", v:num(c.thruplays)});
      metrics.push({k:LANG==="th"?"ต้นทุน/ThruPlay":"Cost/ThruPlay", v:thb(c.costPerThruplay)});
    }
    if(c.reactions>0) metrics.push({k:LANG==="th"?"รีแอค":"Reactions", v:num(c.reactions)});
    return `<div class="cr ${s.good?"good":"bad"}">
      <div class="cr-head" style="background:${s.good?GOODBG:BADBG};color:${s.good?GOOD:BAD}">
        <span class="cr-slot">${s.lbl}</span>
        <span class="cr-fmt">${c.format==="video"?(LANG==="th"?"วิดีโอ":"Video"):(LANG==="th"?"รูปภาพ":"Image")}</span>
      </div>
      <div class="cr-body">
        <div class="cr-name">${c.name}</div>
        <div class="cr-id">Ad ID ${c.adId}</div>
        <div class="cr-metrics">
          ${metrics.map(x=>`<div class="crm"><span>${x.k}</span><b>${x.v}</b></div>`).join("")}
        </div>
        <a class="cr-link" href="${url}" target="_blank" rel="noopener">${T_.viewInMeta}</a>
      </div>
    </div>`;
  }).join("");
}

/* ---------- BENCHMARK ---------- */
function renderBenchmark(){
  const T_=t(), a=cur().account;
  $("benchTitle").textContent=T_.benchTitle;
  $("benchSub").textContent=T_.benchSub;

  const items=[
    {k:"cpm",        lbl:T_.stCpm, you:a.cpm,        fmt:thb},
    {k:"cpc",        lbl:T_.stCpc, you:a.cpc,        fmt:thb},
    {k:"ctr",        lbl:T_.stCtr, you:a.ctr,        fmt:pctS},
    {k:"costPerEng", lbl:T_.stCpe, you:a.costPerEng, fmt:thb},
    {k:"frequency",  lbl:T_.stFreq,you:a.frequency,  fmt:v=>v.toFixed(2)+"×"},
  ];
  $("benchmarks").innerHTML=items.map(it=>{
    const b=BENCH[it.k];
    let good;
    if(b.lower_better===null) good = it.you>=1.5 && it.you<=2.5;
    else good = b.lower_better ? it.you<b.ind : it.you>b.ind;
    const maxV=Math.max(it.you,b.ind)*1.15;
    return `<div class="bm">
      <div class="bm-l">${it.lbl}</div>
      <div class="bm-bars">
        <div class="bm-line"><span class="bm-tag">${T_.you}</span>
          <div class="bm-track"><div style="width:${(it.you/maxV*100).toFixed(1)}%;background:${good?GOOD:BAD}"></div></div>
          <b style="color:${good?GOOD:BAD}">${it.fmt(it.you)}</b></div>
        <div class="bm-line"><span class="bm-tag">${T_.industry}</span>
          <div class="bm-track"><div style="width:${(b.ind/maxV*100).toFixed(1)}%;background:#d9cbb2"></div></div>
          <b style="color:#7d6f64">${b.range}</b></div>
      </div>
    </div>`;
  }).join("");

  const s=splitByObj(cur());
  const verdicts = LANG==="th" ? [
    {kicker:"CPM", title:a.cpm<12?"อยู่ในเกณฑ์":"สูงกว่าเกณฑ์", body:`CPM ${thb(a.cpm)} เทียบกับช่วง F&B อาเซียน ฿8–17`, good:a.cpm<12},
    {kicker:"ต้นทุน/มีส่วนร่วม", title:a.costPerEng<1.5?"ดีกว่าเกณฑ์":"สูงกว่าเกณฑ์", body:`${thb(a.costPerEng)} ต่อการมีส่วนร่วม เทียบกับเกณฑ์ ~฿1.50`, good:a.costPerEng<1.5},
    {kicker:"CTR", title:a.ctr>0.88?"สูงกว่าค่าเฉลี่ย":"ต่ำกว่าค่าเฉลี่ย", body:`${pctS(a.ctr)} เทียบกับค่าเฉลี่ย F&B 0.88% — แคมเปญ Engagement เป็นตัวขับเคลื่อนหลัก`, good:a.ctr>0.88},
    {kicker:"วัตถุประสงค์", title:"ไม่มีการติดตามยอดขาย", body:"Alfredo ขายผ่านร้านสะดวกซื้อและหน้าร้าน จึงไม่ใช้ ROAS หรือ CPA ในการวัดผล ตัวชี้วัดทั้งหมดในรายงานนี้อิงกับ Awareness และ Engagement เท่านั้น", good:null},
  ] : [
    {kicker:"CPM", title:a.cpm<12?"Within range":"Above range", body:`${thb(a.cpm)} CPM against the ฿8–17 SEA food & beverage band.`, good:a.cpm<12},
    {kicker:"Cost per engagement", title:a.costPerEng<1.5?"Beating benchmark":"Above benchmark", body:`${thb(a.costPerEng)} per engagement versus the ~฿1.50 category benchmark.`, good:a.costPerEng<1.5},
    {kicker:"CTR", title:a.ctr>0.88?"Above average":"Below average", body:`${pctS(a.ctr)} against the 0.88% food & beverage average. Engagement campaigns carry this figure.`, good:a.ctr>0.88},
    {kicker:"Measurement", title:"No conversion tracking", body:"Alfredo sells through convenience and offline retail, so ROAS and CPA are not measurable. Every metric here is an awareness or engagement metric.", good:null},
  ];
  $("verdicts").innerHTML=verdicts.map(v=>{
    const c=v.good===null?NEU:v.good?GOOD:BAD;
    const bg=v.good===null?NEUBG:v.good?GOODBG:BADBG;
    return `<div class="vd" style="background:${bg};border-color:${c}33">
      <div class="vd-k" style="color:${c}">${v.kicker}</div>
      <div class="vd-t">${v.title}</div>
      <div class="vd-b">${v.body}</div></div>`;
  }).join("");
}

/* ---------- STRATEGY ---------- */
function renderStrategy(){
  const T_=t();
  $("stratTitle").textContent=T_.stratTitle;
  $("stratSub").textContent=T_.stratSub;
  $("nextTitle").textContent=T_.nextTitle;
  $("nextSub").textContent=T_.nextSub;

  const ins=buildInsights();
  $("insights").innerHTML=ins.map((i,n)=>{
    const pos=["Positive","ดี","High","สูง"].includes(i.impact);
    const warn=["Watch","ติดตาม"].includes(i.impact);
    const c=warn?BAD:pos?GOOD:NEU, bg=warn?BADBG:pos?GOODBG:NEUBG;
    return `<div class="ins">
      <div class="ins-top">
        <span class="ins-n">${String(n+1).padStart(2,"0")}</span>
        <span class="ins-tag" style="color:${c};background:${bg}">${i.tag}</span>
      </div>
      <div class="ins-t">${i.title}</div>
      <div class="ins-b">${i.body}</div>
    </div>`;
  }).join("");

  const steps=buildNextSteps();
  $("nextSteps").innerHTML=steps.map((s,n)=>`
    <div class="ns">
      <div class="ns-n">${n+1}</div>
      <div class="ns-c">
        <div class="ns-t">${s.title}</div>
        <div class="ns-b">${s.body}</div>
        <div class="ns-m"><span>${s.when}</span><span>·</span><span>${s.owner}</span></div>
      </div>
    </div>`).join("");
}

/* ---------- MASTER ---------- */
function renderAll(){
  renderChrome();
  if(TAB===0) renderOverview();
  if(TAB===1) renderPerformance();
  if(TAB===2) renderCreatives();
  if(TAB===3) renderBenchmark();
  if(TAB===4) renderStrategy();
}
function setTab(i){ TAB=i; renderAll(); window.scrollTo({top:0,behavior:"smooth"}); }
function setLang(l){ LANG=l; renderAll(); }
function onPeriod(v){ CUR=v; if(CMP===CUR){ CMP=MONTH_KEYS.find(k=>k!==CUR)||CUR; } renderAll(); }
function onCompare(v){ CMP=v; renderAll(); }


/* boot */
document.documentElement.lang = LANG;
const _setLang = setLang;
setLang = function(l){ document.documentElement.lang=l; _setLang(l); };
renderAll();
</script>
